<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEIC to JPEG</title>
<script src="https://cdn.jsdelivr.net/npm/heic-to@1.6.7/dist/iife/heic-to.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#f3f4ef;--panel:#fff;--fg:#1d2a24;--muted:#5d6b63;--line:#d5dbd3;--accent:#255442;--accent-fg:#fff;--ok:#2f7a4c;--err:#b3261e;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121a16;--panel:#1b2620;--fg:#e6efe8;--muted:#9fb0a5;--line:#34453b;--accent:#9fd8b2;--accent-fg:#10241a;--ok:#8fd6a5;--err:#f2a39c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,"Segoe UI",sans-serif;padding:32px 16px}
main{max-width:720px;margin:0 auto;display:grid;gap:18px}
h1{margin:0;font-size:26px}
p{margin:0;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:36px 20px;text-align:center;cursor:pointer;display:grid;gap:8px}
.drop.over{border-color:var(--accent)}
.drop strong{font-size:17px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.main{background:var(--accent);color:var(--accent-fg);border-color:transparent}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.drop:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label{display:flex;gap:8px;align-items:center}
ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
li{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
li .name{flex:1;min-width:0;overflow-wrap:anywhere}
li .st{font-size:13px;color:var(--muted);white-space:nowrap}
li.done .st{color:var(--ok)} li.fail .st{color:var(--err)}
li img{width:44px;height:44px;object-fit:cover;border-radius:6px}
.sum{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>HEIC to JPEG</h1>
  <p>Convert iPhone photos to JPEG. The conversion runs in this browser, so your photos are never uploaded.</p>

  <div class="drop" id="drop" tabindex="0" role="button" aria-label="Choose HEIC photos">
    <strong>Drop HEIC photos here</strong>
    <span>or click to choose files (you can select many at once)</span>
    <input type="file" id="pick" accept=".heic,.heif,image/heic,image/heif" multiple hidden>
  </div>

  <div class="bar">
    <label for="q">JPEG quality <input type="range" id="q" min="50" max="100" value="90"> <span id="qv" class="sum">90</span></label>
    <button class="main" id="zip" disabled>Download all as ZIP</button>
    <button id="clear" disabled>Clear</button>
    <span class="sum" id="sum"></span>
  </div>

  <ul id="list"></ul>
</main>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), pick = $('pick'), list = $('list');
const results = []; // {name, blob}
let pending = 0, total = 0, failed = 0;

$('q').oninput = e => $('qv').textContent = e.target.value;
drop.onclick = () => pick.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick.click(); } };
pick.onchange = () => { addFiles(pick.files); pick.value = ''; };
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => addFiles(e.dataTransfer.files));

function jpgName(name) {
  let base = name.replace(/\.(heic|heif)$/i, '') + '.jpg', n = 2;
  while (results.some(r => r.name === base)) base = name.replace(/\.(heic|heif)$/i, '') + ' (' + n++ + ').jpg';
  return base;
}

function updateSummary() {
  const done = results.length;
  $('sum').textContent = total ? `${done} of ${total} converted` + (failed ? ` · ${failed} failed` : '') + (pending ? ' · working…' : '') : '';
  $('zip').disabled = !done || pending > 0;
  $('clear').disabled = !total || pending > 0;
}

// Convert one at a time so large batches don't run out of memory.
let queue = Promise.resolve();
function addFiles(files) {
  for (const file of files) {
    total++; pending++;
    const li = document.createElement('li');
    li.innerHTML = '<span class="name"></span><span class="st">Waiting</span>';
    li.querySelector('.name').textContent = file.name;
    list.append(li);
    updateSummary();
    queue = queue.then(() => convert(file, li));
  }
}

async function convert(file, li) {
  const st = li.querySelector('.st');
  st.textContent = 'Converting…';
  try {
    const blob = await HeicTo({ blob: file, type: 'image/jpeg', quality: $('q').value / 100 });
    const name = jpgName(file.name);
    results.push({ name, blob });
    const url = URL.createObjectURL(blob);
    const img = new Image(); img.src = url; img.alt = '';
    li.prepend(img);
    st.textContent = (blob.size / 1048576).toFixed(1) + ' MB';
    const a = document.createElement('button');
    a.textContent = 'Save';
    a.onclick = () => save(blob, name);
    li.append(a);
    li.classList.add('done');
  } catch (err) {
    failed++;
    li.classList.add('fail');
    st.textContent = 'Could not convert this file. Is it a HEIC photo?';
    console.error(file.name, err);
  }
  pending--;
  updateSummary();
}

function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

$('zip').onclick = async () => {
  $('zip').disabled = true;
  const zip = new JSZip();
  for (const r of results) zip.file(r.name, r.blob);
  const blob = await zip.generateAsync({ type: 'blob', compression: 'STORE' });
  save(blob, 'converted-jpegs.zip');
  $('zip').disabled = false;
};

$('clear').onclick = () => {
  results.length = 0; total = 0; failed = 0;
  list.innerHTML = '';
  updateSummary();
};
</script>
</body>
</html>
